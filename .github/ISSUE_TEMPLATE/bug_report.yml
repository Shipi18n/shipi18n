name: Bug report
description: Something translated incorrectly, crashed, or behaved unexpectedly
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Which package?
      options:
        - "@shipi18n/core"
        - "@shipi18n/cli"
        - "@shipi18n/mcp"
        - vite-plugin-shipi18n
        - shipi18n-github-action
        - not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "2.0.1"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [anthropic, openai, MCP sampling (no key), custom adapter]

  - type: textarea
    id: reproduce
    attributes:
      label: A locale file or string that reproduces it
      description: The smallest input that shows the problem, plus the source and target languages.
      render: json
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what you got instead
    validations:
      required: true
