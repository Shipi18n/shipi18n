name: Feature request
description: Suggest something Shipi18n should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow you are stuck on rather than the solution you have in mind — it often turns out there is a simpler fix.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
