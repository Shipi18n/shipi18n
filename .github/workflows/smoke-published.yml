# P4 — post-publish clean-room smoke test.
#
# Every other test in this repo runs against the WORKSPACE, where `workspace:^`
# means "the code in the next folder", never what npm actually resolves for a
# user. That blind spot shipped real bugs (the 2.0.0 bin-symlink guard; the
# OpenAI `max_tokens` break). This job installs the PUBLISHED packages from the
# registry into a clean directory and drives them the way a user does.
#
# Runs after a publish completes, weekly (to catch a bad resolved *combination*
# even when nothing was published), and on demand.
name: smoke-published

on:
  workflow_run:
    workflows: ['publish']
    types: [completed]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the PUBLISHED packages into a clean dir
        run: |
          mkdir -p /tmp/clean && cd /tmp/clean
          npm init -y >/dev/null
          npm i @shipi18n/cli @shipi18n/core @shipi18n/mcp
          echo "resolved versions:" && npm ls --depth=0 2>/dev/null | grep shipi18n

      - name: CLI check exits non-zero on a planted defect (fail path)
        run: |
          cd /tmp/clean && mkdir -p locales
          echo '{"a":"Hello {{name}}","b":"Bye"}' > locales/en.json
          echo '{"a":"Hola"}'                     > locales/es.json   # missing b, dropped {{name}}
          set +e
          npx shipi18n check ./locales -s en; code=$?
          set -e
          test "$code" = "1" || { echo "expected exit 1, got $code"; exit 1; }

      - name: CLI check exits zero on a clean tree (pass path) + SARIF has helpUri
        run: |
          cd /tmp/clean
          echo '{"a":"Hola {{name}}","b":"Adiós"}' > locales/es.json
          npx shipi18n check ./locales -s en
          npx shipi18n check ./locales -s en -r sarif -o out.sarif || true
          echo '{"a":"Hello {{name}}"}' > locales/en.json
          echo '{"a":"Hola"}'            > locales/es.json
          npx shipi18n check ./locales -s en -r sarif -o out.sarif || true
          grep -q 'docs/rules/placeholder-missing' out.sarif || { echo 'SARIF missing per-rule helpUri'; exit 1; }

      - name: MCP server answers initialize + tools/list over stdio (all 8 tools)
        run: |
          cd /tmp/clean
          node -e '
            const { spawn } = require("node:child_process");
            const c = spawn("npx", ["-y", "@shipi18n/mcp"], { stdio: ["pipe","pipe","pipe"] });
            let buf = ""; const byId = {};
            c.stdout.on("data", d => { buf += d; let n; while ((n = buf.indexOf("\n")) >= 0) { const l = buf.slice(0,n).trim(); buf = buf.slice(n+1); if(!l) continue; try { const m = JSON.parse(l); if (m.id!=null) byId[m.id]=m; } catch {} } });
            const send = o => c.stdin.write(JSON.stringify(o)+"\n");
            send({jsonrpc:"2.0",id:1,method:"initialize",params:{protocolVersion:"2024-11-05",capabilities:{},clientInfo:{name:"smoke",version:"1"}}});
            send({jsonrpc:"2.0",method:"notifications/initialized"});
            send({jsonrpc:"2.0",id:2,method:"tools/list"});
            setTimeout(() => {
              c.kill();
              const name = byId[1]?.result?.serverInfo?.name;
              const tools = byId[2]?.result?.tools || [];
              if (name !== "shipi18n") { console.error("bad serverInfo:", name); process.exit(1); }
              if (tools.length !== 8) { console.error("expected 8 tools, got", tools.length); process.exit(1); }
              console.log("MCP ok — 8 tools:", tools.map(t=>t.name).join(", "));
              process.exit(0);
            }, 8000);
          '

      - name: core resolves and runs (checkTranslations)
        run: |
          cd /tmp/clean
          node --input-type=module -e '
            import { checkTranslations } from "@shipi18n/core";
            const { findings } = checkTranslations({ source:{a:"Hi {{x}}"}, target:{}, targetLang:"es" });
            if (!findings.some(f => f.type === "missing-key")) { console.error("core check did not flag missing key"); process.exit(1); }
            console.log("core ok");
          '
