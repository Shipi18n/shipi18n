name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref — a PR push should not queue behind itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stale-strings:
    # Copy from the retired hosted product must not come back (docs/canonical.md has the current wording).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-stale-strings.mjs

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm must be installed before setup-node, so setup-node can cache its store.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        # Every package's suite runs against a mock adapter, so no API key is
        # needed and CI never spends tokens.
        run: pnpm test

  package:
    name: package integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Pack every publishable package
        # Catches the classic monorepo publish bug: a workspace:* dependency
        # escaping into a tarball, which installs broken for everyone.
        run: |
          set -euo pipefail
          for dir in packages/core packages/cli packages/vite-plugin packages/mcp; do
            (cd "$dir" && pnpm pack --pack-destination /tmp/tarballs)
          done
          echo "--- checking for unresolved workspace: ranges ---"
          for tgz in /tmp/tarballs/*.tgz; do
            manifest=$(tar -xzOf "$tgz" package/package.json)
            if echo "$manifest" | grep -q '"workspace:'; then
              echo "::error::$tgz contains an unresolved workspace: range"
              exit 1
            fi
            echo "ok: $(basename "$tgz")"
          done
