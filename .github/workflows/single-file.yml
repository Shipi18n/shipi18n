# Publish the CLI as ONE file — no npm install, no node_modules — on every v* tag:
#
#   curl -fsSLO https://github.com/Shipi18n/shipi18n/releases/download/vX.Y.Z/shipi18n.mjs
#   curl -fsSLO https://github.com/Shipi18n/shipi18n/releases/download/vX.Y.Z/shipi18n.mjs.sha256
#   sha256sum -c shipi18n.mjs.sha256 && node shipi18n.mjs check ./locales -s en
#
# For maintainers who won't take anything from npm into CI (24pullrequests,
# 2026-09-30). The file is verified against the CLI's agent-contract suite before
# it is attached, and carries a GitHub build-provenance attestation:
#   gh attestation verify shipi18n.mjs -R Shipi18n/shipi18n
name: single-file

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and attach, e.g. v2.13.1'
        required: true

permissions:
  contents: read

jobs:
  single-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release / upload assets
      id-token: write      # build-provenance attestation
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build shipi18n.mjs
        run: |
          set -euo pipefail
          mkdir -p out
          node packages/cli/scripts/build-single.mjs "$PWD/out/shipi18n.mjs"
          want="${TAG#v}"
          got=$(node out/shipi18n.mjs --version)
          [ "$got" = "$want" ] || { echo "built $got, tag says $want"; exit 1; }

      # The file must behave exactly like the npm package: same suite, same exit codes.
      - name: Agent-contract + init suites against the single file (run outside the repo)
        run: |
          set -euo pipefail
          mkdir -p /tmp/iso && cp out/shipi18n.mjs /tmp/iso/
          cd packages/cli && SHIPI18N_BIN=/tmp/iso/shipi18n.mjs NODE_OPTIONS=--experimental-vm-modules npx jest agent-contract init

      - name: Checksum
        working-directory: out
        run: sha256sum shipi18n.mjs > shipi18n.mjs.sha256 && cat shipi18n.mjs.sha256

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/shipi18n.mjs

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes "npm: \`@shipi18n/cli@${TAG#v}\`. Single file (no npm install): \`shipi18n.mjs\` below, with its SHA-256 and a build-provenance attestation. Changes: https://github.com/Shipi18n/shipi18n/blob/$TAG/packages/cli/CHANGELOG.md"
          fi
          gh release upload "$TAG" out/shipi18n.mjs out/shipi18n.mjs.sha256 --clobber
