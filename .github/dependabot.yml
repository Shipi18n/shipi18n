# Weekly, grouped, so updates arrive as a few PRs rather than one per package.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm # example apps (own package-lock.json each)
    directories: [/examples/nextjs, /examples/nodejs, /examples/react, /examples/vue]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      examples:
        update-types: [minor, patch]

  - package-ecosystem: github-actions # keeps the SHA pins current
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
